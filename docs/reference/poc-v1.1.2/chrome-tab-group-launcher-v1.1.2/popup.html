<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tab Group Launcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>Tab Group Launcher</h1>
    <p class="hint">既存のタブグループへ移動します。</p>
    <section class="actions">
      <button data-title="研究">研究を開く</button>
      <button data-title="7脱">7脱を開く</button>
      <button id="collapse-all" class="secondary">全グループを折りたたむ</button>
    </section>
    <section>
      <h2>現在のグループ</h2>
      <div id="groups" class="groups">読み込み中…</div>
    </section>
    <section>
      <h2>PoC情報</h2>
      <div id="extension-id" class="mono"></div>
    </section>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
