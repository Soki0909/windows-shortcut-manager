name: 改善・機能を提案
description: 困っている利用場面と、解決できたと判断する条件を記載します。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 公開フォームです。個人情報、実際の設定や業務URLを含めず説明してください。安全性の問題は非公開報告を使ってください。
  - type: textarea
    id: problem
    attributes:
      label: 誰が、どんな場面で困っていますか
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: どうなれば解決ですか
      description: 実際に確認できる動作・受け入れ条件を記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 現在の回避方法・補足
      description: 変更時に維持してほしいデータや操作があれば記載してください。
