name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
      extension: ${{ steps.scope.outputs.extension }}
      deployment: ${{ steps.scope.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/test-ci-scope.ps1
          foreach ($file in Get-ChildItem scripts -Recurse -File | Where-Object Extension -in '.ps1','.psm1') {
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$null,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($file.Name): $($errors.Message -join ', ')" }
          }
      - id: scope
        shell: pwsh
        run: |
          $scope = ./scripts/get-ci-scope.ps1 -Base $env:BASE_SHA -Head $env:HEAD_SHA
          "windows=$($scope.Windows.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "extension=$($scope.Extension.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "deployment=$($scope.Deployment.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $scope | Format-List
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
  dotnet:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore ShortcutManager.sln
      - run: dotnet build ShortcutManager.sln -c Release --no-restore
      - run: dotnet test ShortcutManager.sln -c Release --no-build
      - shell: pwsh
        run: ./scripts/run-debug.ps1 -NoLaunch
      - shell: pwsh
        run: ./scripts/test-cli.ps1
      - shell: pwsh
        run: ./scripts/test-signing.ps1
      - shell: pwsh
        run: ./scripts/test-installer-payload.ps1
      - run: dotnet build tests/ShortcutManager.LiveDriver/ShortcutManager.LiveDriver.csproj -c Debug --nologo
      - shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release -Version 0.4.0
      - shell: pwsh
        run: |
          ./scripts/prepare-installer-tools.ps1
          ./scripts/package-installer.ps1 -Version 0.4.0 -SkipPublish
          ./scripts/verify-branding.ps1 -Version 0.4.0
          ./scripts/verify-release-artifacts.ps1 -Version 0.4.0 -RunInstallerSmoke -RequireMetadata -ExpectedSourceCommit $env:GITHUB_SHA -RequireCleanSource
          ./scripts/test-release-signing.ps1 -Version 0.4.0
          ./scripts/test-build-metadata.ps1 -Version 0.4.0
          ./scripts/test-installer-lifecycle.ps1 -Version 0.4.0
  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test tests/ChromeExtension.Tests/protocol.test.js tests/ChromeExtension.Tests/worker-regressions.test.js
      - run: node --check scripts/test-chrome-live.mjs
      - shell: pwsh
        run: ./scripts/verify-version.ps1 -ExpectedVersion 0.4.0
  extension-deployment:
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: ./scripts/test-extension-deployment.ps1

