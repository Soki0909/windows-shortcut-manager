name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = if ($env:RELEASE_REF_TYPE -eq 'tag') { $env:RELEASE_TAG.TrimStart('v') } else { '0.4.0' }
          dotnet restore ShortcutManager.sln
          dotnet test ShortcutManager.sln -c Release --no-restore
          node --test tests/ChromeExtension.Tests/protocol.test.js tests/ChromeExtension.Tests/worker-regressions.test.js
          ./scripts/test-signing.ps1
          ./scripts/test-installer-payload.ps1
          ./scripts/package.ps1 -Version $version -RequireCleanSource
          ./scripts/prepare-installer-tools.ps1
          ./scripts/package-installer.ps1 -Version $version -SkipPublish
          ./scripts/verify-branding.ps1 -Version $version
          ./scripts/verify-release-artifacts.ps1 -Version $version -RunInstallerSmoke -RequireMetadata -ExpectedSourceCommit $env:GITHUB_SHA -RequireCleanSource
          ./scripts/test-installer-maintenance.ps1
          ./scripts/test-installer-lifecycle.ps1 -Version $version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
      - name: Attest final release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/ShortcutManager-*.zip
            artifacts/ShortcutManager-Setup-*.exe
            artifacts/SHA256SUMS.txt
      - name: Verify build provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($artifact in Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.zip','.exe' -or $_.Name -eq 'SHA256SUMS.txt' }) {
            gh attestation verify $artifact.FullName --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest $env:GITHUB_SHA --source-ref $env:GITHUB_REF --deny-self-hosted-runners
          }
        env:
          GH_TOKEN: ${{ github.token }}
      - shell: pwsh
        if: github.ref_type == 'tag'
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -VerifyAttestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
