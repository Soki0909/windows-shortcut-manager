name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.1.0' }
          dotnet restore ShortcutManager.sln
          dotnet test ShortcutManager.sln -c Release --no-restore
          node --test tests/ChromeExtension.Tests/protocol.test.js
          ./scripts/package.ps1 -Version $version
          ./scripts/prepare-installer-tools.ps1
          ./scripts/package-installer.ps1 -Version $version -SkipPublish
          ./scripts/verify-branding.ps1 -Version $version
      - shell: pwsh
        if: github.ref_type == 'tag'
        run: gh release create "${{ github.ref_name }}" artifacts/*.zip artifacts/ShortcutManager-Setup-*.exe artifacts/SHA256SUMS.txt --verify-tag --title "Shortcut Manager ${{ github.ref_name }}" --notes-file "docs/releases/${{ github.ref_name }}.md"
        env:
          GH_TOKEN: ${{ github.token }}
