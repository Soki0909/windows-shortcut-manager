name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = if ($env:RELEASE_REF_TYPE -eq 'tag') { $env:RELEASE_TAG.TrimStart('v') } else { '0.3.0' }
          dotnet restore ShortcutManager.sln
          dotnet test ShortcutManager.sln -c Release --no-restore
          node --test tests/ChromeExtension.Tests/protocol.test.js tests/ChromeExtension.Tests/worker-regressions.test.js
          ./scripts/package.ps1 -Version $version
          ./scripts/prepare-installer-tools.ps1
          ./scripts/package-installer.ps1 -Version $version -SkipPublish
          ./scripts/verify-branding.ps1 -Version $version
          ./scripts/verify-release-artifacts.ps1 -Version $version -RunInstallerSmoke
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
      - shell: pwsh
        if: github.ref_type == 'tag'
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
