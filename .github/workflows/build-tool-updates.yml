name: Build tool updates
on:
  schedule:
    - cron: '23 1 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-inno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: |
          $result = ./scripts/check-build-tools.ps1
          $result | Format-List
          if ($result.UpgradeAvailable) {
            throw "New Inno Setup $($result.LatestVersion): review release notes, license, Authenticode and SHA-256 under issue #60 before updating scripts/build-tools.json. $($result.ReleaseUrl)"
          }
        env:
          GH_TOKEN: ${{ github.token }}
