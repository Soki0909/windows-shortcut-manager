<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shortcut Manager Tab Bridge</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header><h1>Shortcut Manager Tab Bridge</h1><p id="identity"></p></header>
  <p>Protocol v1対応。開閉HotKeyはManager v0.2.0以降、旧版の「開く」も利用できます。</p>
  <label class="setting"><input id="collapse-startup" type="checkbox"> Chrome 起動時に全グループを折りたたむ</label>
  <label class="setting"><input id="debug-mode" type="checkbox"> 失敗ページに診断情報を表示する</label>
  <div class="toolbar"><button id="refresh">更新</button><button id="collapse-all" class="secondary">すべて折りたたむ</button></div>
  <h2>現在開いているグループ</h2><div id="groups" class="groups">読み込み中…</div>
  <p id="status" aria-live="polite"></p>
</main><script type="module" src="popup.js"></script></body>
</html>
